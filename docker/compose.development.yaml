services:
  api:
    environment:
      APP_ENV: development
    volumes:
      - ..:/workspace
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8020"
      - --reload

  streamlit:
    environment:
      APP_ENV: development
    volumes:
      - ..:/workspace

  django:
    environment:
      APP_ENV: development
      DJANGO_DEBUG: "true"
    volumes:
      - ..:/workspace
    command:
      - python
      - web/manage.py
      - runserver
      - 0.0.0.0:8000
