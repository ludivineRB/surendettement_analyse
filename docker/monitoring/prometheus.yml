global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8020"]
  - job_name: assistant
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["assistant-api:8030"]
  - job_name: django
    metrics_path: /metrics/
    static_configs:
      - targets: ["django:8000"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
