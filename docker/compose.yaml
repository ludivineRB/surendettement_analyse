services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surendettement}
      POSTGRES_USER: ${POSTGRES_USER:-surendettement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surendettement}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-surendettement}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-surendettement}
    volumes:
      - ../data/processed/analytics:/workspace/data/processed/analytics:ro
    ports:
      - "${API_PORT:-8020}:8020"
    depends_on:
      postgres:
        condition: service_healthy

  assistant-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: assistant-api
    environment:
      ANALYTICS_API_BASE_URL: http://api:8020
      ASSISTANT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-surendettement}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-surendettement}
    ports:
      - "${ASSISTANT_API_PORT:-8030}:8030"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: streamlit
    environment:
      SURENDETTEMENT_API_URL: http://api:8020/api/data/streamlit?limit=50000
      INCLUSION_FINANCIERE_API_URL: http://api:8020/api/data/inclusion-financiere?limit=100000
      REGIONAL_MACRO_API_URL: http://api:8020/api/data/macro-economic-regions?limit=5000
      RISK_SCORES_API_URL: http://api:8020/api/risk-scores
      OBSERVABILITY_API_URL: http://api:8020/api/data/observability
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      - api

  django:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: django
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-surendettement}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-surendettement}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      ANALYTICS_API_BASE_URL: http://api:8020
      ANALYTICS_API_TIMEOUT_SECONDS: ${ANALYTICS_API_TIMEOUT_SECONDS:-5}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
