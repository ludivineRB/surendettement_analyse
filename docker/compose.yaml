services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surendettement}
      POSTGRES_USER: ${POSTGRES_USER:-surendettement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surendettement}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &bounded-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-surendettement}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-surendettement}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    logging: *bounded-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
      - assistant-api
      - django
      - postgres-exporter
      - alertmanager
    logging: *bounded-logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    logging: *bounded-logging

  loki:
    image: grafana/loki:3.5.3
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    logging: *bounded-logging

  promtail:
    image: grafana/promtail:3.5.3
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    logging: *bounded-logging

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - prometheus
      - loki
    logging: *bounded-logging

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-surendettement}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-surendettement}
      ANALYTICS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-surendettement}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-surendettement}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8020}:8020"
    logging: *bounded-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8020/api/data/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  ci:
    profiles: ["ci"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ci
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-surendettement}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-surendettement}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ci-only-secret}
      ASSISTANT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-surendettement}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-surendettement}
      ASSISTANT_INTERNAL_TOKEN: ${ASSISTANT_INTERNAL_TOKEN:-ci-only-token}
    depends_on:
      postgres:
        condition: service_healthy

  assistant-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: assistant-api
    environment:
      ANALYTICS_API_BASE_URL: http://api:8020
      ASSISTANT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-surendettement}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-surendettement}
      ANALYTICS_READONLY_DATABASE_URL: ${ANALYTICS_READONLY_DATABASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      ASSISTANT_INTERNAL_TOKEN: ${ASSISTANT_INTERNAL_TOKEN:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ASSISTANT_API_PORT:-8030}:8030"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8030/health/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *bounded-logging
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: streamlit
    environment:
      SURENDETTEMENT_API_URL: http://api:8020/api/data/streamlit?limit=50000
      INCLUSION_FINANCIERE_API_URL: http://api:8020/api/data/inclusion-financiere?limit=100000
      REGIONAL_MACRO_API_URL: http://api:8020/api/data/macro-economic-regions?limit=5000
      RISK_SCORES_API_URL: http://api:8020/api/risk-scores
      OBSERVABILITY_API_URL: http://api:8020/api/data/observability
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${STREAMLIT_PORT:-8501}:8501"
    logging: *bounded-logging
    depends_on:
      - api

  django:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: django
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-surendettement}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-surendettement}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},django
      ANALYTICS_API_BASE_URL: http://api:8020
      ANALYTICS_API_TIMEOUT_SECONDS: ${ANALYTICS_API_TIMEOUT_SECONDS:-5}
      ASSISTANT_API_BASE_URL: http://assistant-api:8030
      ASSISTANT_API_TIMEOUT_SECONDS: ${ASSISTANT_API_TIMEOUT_SECONDS:-90}
      ASSISTANT_INTERNAL_TOKEN: ${ASSISTANT_INTERNAL_TOKEN:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DJANGO_PORT:-8000}:8000"
    logging: *bounded-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      assistant-api:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
