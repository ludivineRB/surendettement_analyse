services:
  - type: web
    name: surendettement-staging-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    dockerCommand: python -m src.render_start api
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: surendettement-staging-db
          property: connectionString
      - key: ANALYTICS_DATABASE_URL
        fromDatabase:
          name: surendettement-staging-db
          property: connectionString
      - key: ASSISTANT_INTERNAL_TOKEN
        generateValue: true

  - type: web
    name: surendettement-staging-assistant
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    dockerCommand: python -m src.render_start assistant
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: ASSISTANT_DATABASE_URL
        fromDatabase:
          name: surendettement-staging-db
          property: connectionString
      - key: ANALYTICS_API_BASE_URL
        fromService:
          name: surendettement-staging-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ANALYTICS_API_TIMEOUT_SECONDS
        value: 90
      - key: ASSISTANT_INTERNAL_TOKEN
        fromService:
          name: surendettement-staging-api
          type: web
          envVarKey: ASSISTANT_INTERNAL_TOKEN
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: ANALYTICS_READONLY_DATABASE_URL
        sync: false

  - type: web
    name: surendettement-staging-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    dockerCommand: python -m src.render_start django
    healthCheckPath: /health/live/
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: surendettement-staging-db
          property: connectionString
      - key: ANALYTICS_API_BASE_URL
        fromService:
          name: surendettement-staging-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ASSISTANT_API_BASE_URL
        fromService:
          name: surendettement-staging-assistant
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ANALYTICS_API_TIMEOUT_SECONDS
        value: 90
      - key: ASSISTANT_API_TIMEOUT_SECONDS
        value: 90
      - key: ASSISTANT_INTERNAL_TOKEN
        fromService:
          name: surendettement-staging-api
          type: web
          envVarKey: ASSISTANT_INTERNAL_TOKEN
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECURE_COOKIES
        value: true
      - key: DJANGO_TRUST_PROXY_HEADERS
        value: true

  - type: web
    name: surendettement-staging-streamlit
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    dockerCommand: python -m src.render_start streamlit
    healthCheckPath: /_stcore/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: SURENDETTEMENT_API_TIMEOUT
        value: 90
      - key: SURENDETTEMENT_API_BASE_URL
        fromService:
          name: surendettement-staging-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ASSISTANT_INTERNAL_TOKEN
        fromService:
          name: surendettement-staging-api
          type: web
          envVarKey: ASSISTANT_INTERNAL_TOKEN

databases:
  - name: surendettement-staging-db
    plan: free
    region: frankfurt
    databaseName: surendettement_staging
    user: surendettement_staging
    ipAllowList: []
