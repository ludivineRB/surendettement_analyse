services:
  - type: web
    name: surendettement-staging-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    dockerCommand: >-
      python -c "from src.storage.schema_migrations import apply_migrations;
      print(apply_migrations())" &&
      exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: surendettement-staging-db
          property: connectionString
      - key: ANALYTICS_DATABASE_URL
        fromDatabase:
          name: surendettement-staging-db
          property: connectionString
      - key: ASSISTANT_INTERNAL_TOKEN
        generateValue: true

  - type: web
    name: surendettement-staging-assistant
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    dockerCommand: >-
      python -m assistant_api.cli migrate &&
      exec uvicorn assistant_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: ASSISTANT_DATABASE_URL
        fromDatabase:
          name: surendettement-staging-db
          property: connectionString
      - key: ANALYTICS_API_BASE_URL
        fromService:
          name: surendettement-staging-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ASSISTANT_INTERNAL_TOKEN
        fromService:
          name: surendettement-staging-api
          type: web
          envVarKey: ASSISTANT_INTERNAL_TOKEN
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: ANALYTICS_READONLY_DATABASE_URL
        sync: false

  - type: web
    name: surendettement-staging-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    dockerCommand: >-
      python web/manage.py migrate --noinput &&
      python web/manage.py collectstatic --noinput &&
      exec gunicorn web.config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/live/
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: surendettement-staging-db
          property: connectionString
      - key: ANALYTICS_API_BASE_URL
        fromService:
          name: surendettement-staging-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ASSISTANT_API_BASE_URL
        fromService:
          name: surendettement-staging-assistant
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ASSISTANT_INTERNAL_TOKEN
        fromService:
          name: surendettement-staging-api
          type: web
          envVarKey: ASSISTANT_INTERNAL_TOKEN
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECURE_COOKIES
        value: true
      - key: DJANGO_TRUST_PROXY_HEADERS
        value: true

  - type: web
    name: surendettement-staging-streamlit
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    dockerCommand: >-
      exec streamlit run app.py --server.address 0.0.0.0
      --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: SURENDETTEMENT_API_BASE_URL
        fromService:
          name: surendettement-staging-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: surendettement-staging-db
    plan: free
    region: frankfurt
    databaseName: surendettement_staging
    user: surendettement_staging
    ipAllowList: []
