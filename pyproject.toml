[tool.pytest.ini_options]
testpaths = ["tests", "app/tests", "web"]
markers = [
  "postgres_integration: tests requiring an explicit disposable PostgreSQL URL",
]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "venv",
  "data",
  "notebooks",
  "**/migrations/*.py",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["assistant_api", "app", "src", "web"]
omit = ["*/migrations/*", "*/tests.py", "*/test_*.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true
