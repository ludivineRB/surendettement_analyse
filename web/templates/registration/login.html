{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
  <h1>Connexion</h1>
  {% if form.errors %}
    <p>Identifiants invalides.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Se connecter</button>
  </form>
  <p>
    Pas encore de compte ?
    <a href="{% url 'register' %}">Envoyer une demande d'inscription</a>.
  </p>
{% endblock %}
